version: 2
# Monthly and grouped so it stays a single low-noise PR per ecosystem.
# npm is deliberately absent: the framework pins playwright-core exactly (Edge/CDP compatibility), its checked-in .npmrc points at an
# internal mirror placeholder that Dependabot cannot reach, and no lockfile is committed. security.yml audits the npm dependency weekly instead.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: "/components/wrapper-core"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps(wrapper-core)"
  - package-ecosystem: pip
    directory: "/components/automation-builder/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps(builder)"
