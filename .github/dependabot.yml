version: 2
# Monthly and grouped so it stays a single low-noise PR per ecosystem.
# npm: the framework pins playwright-core exactly (Edge/CDP compatibility), so only minor/patch updates are proposed; a lockfile is not
# committed (the bundle is built with `npm install --omit=dev --ignore-scripts` in CI and the security workflow audits a generated one).
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: "/components/wrapper-core"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps(wrapper-core)"
  - package-ecosystem: pip
    directory: "/components/automation-builder/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps(builder)"
  - package-ecosystem: npm
    directory: "/components/execution-framework"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "deps(framework)"
