version: 2
# Monthly and grouped so it stays a single low-noise PR per ecosystem.
# The npm ecosystem is intentionally absent until components/execution-framework/package-lock.json is committed
# (generate it once with `npm install --package-lock-only` against your mirror, then add the npm block back).
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: "/components/wrapper-core"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps(wrapper-core)"
  - package-ecosystem: pip
    directory: "/components/automation-builder/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps(builder)"
