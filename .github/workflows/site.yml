name: site

# Builds the whole site (landing, install center, docs, registry portal + admin panel, dashboards, program, jobs, machines, queues, schedules, audit) and
# deploys it to GitHub Pages. It also publishes the registry (manifest.yaml + artifacts) that installed machines self-heal from:
#   https://<owner>.github.io/<repo>/registry/
#
# LIVE DATA: the dashboards are built from the real run logs that installed automations push to the private logs repo
# <owner>/AutoStation-logs (branch `ingest`). That needs the repository secret LOGGING_TOKEN (a fine-grained PAT, contents
# read+write on the logs repo only; see docs/LIVE_LOGGING.md). Every 30 minutes and after every release/installer build
# this workflow ingests the logs, recomputes the compliance signals and republishes. Without the secret the dashboards show
# an honest "waiting for the first run" state - never demo data.
# NOTE: GitHub Pages sites are public; run logs contain host names, user hashes and automation events (never secrets).
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: [installers, release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      LOG_REPO: ${{ vars.AUTOSTATION_LOG_REPO || format('{0}/AutoStation-logs', github.repository_owner) }}
      # a read-only token is preferred when you create one (LOGS_READ_TOKEN); the installer's write token is the fallback
      LOGGING_TOKEN: ${{ secrets.LOGS_READ_TOKEN || secrets.LOGGING_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Bundle Node + playwright-core (the registry compares package content, so the framework must be built exactly as in release)
        run: python tools/build_framework_bundle.py
      - name: Fetch published registry artifacts (if any)
        id: artifacts
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" registry-artifacts >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch registry-artifacts "$URL" ../ra
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no registry-artifacts branch yet - the release workflow creates it"
          fi
      - name: Build the registry from main + published artifacts
        id: registry
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        continue-on-error: true
        run: python tools/build_registry.py --out registry-out --artifacts-dir ../ra
      - name: Overlay on-demand triggers (branch 'triggers', written by ops-action)
        if: ${{ steps.registry.outcome == 'success' }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch triggers "$URL" ../tr 2>/dev/null && [ -f ../tr/components/automation-registry/triggers.json ]; then
            cp ../tr/components/automation-registry/triggers.json registry-out/triggers.json
            echo "overlaid triggers.json from the triggers branch"
          fi
      - name: Sign the registry manifest (Ed25519; skipped until the REGISTRY_SIGNING_SEED secret exists)
        if: ${{ steps.registry.outcome == 'success' }}
        env:
          REGISTRY_SIGNING_SEED: ${{ secrets.REGISTRY_SIGNING_SEED }}
        run: |
          if [ -n "$REGISTRY_SIGNING_SEED" ]; then
            # a re-run of an old workflow run must not re-sign an OLDER manifest with a fresh signed_at (that would defeat rollback protection)
            HEAD_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
            if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
              echo "::error title=stale run::this run is for ${GITHUB_SHA} but main is at ${HEAD_SHA:-unknown}; refusing to sign or deploy. A newer run covers it."
              exit 1
            fi
          fi
          python tools/sign_registry.py --registry-dir registry-out
      - name: Fetch the live run logs (private logs repo, branch ingest)
        id: logs
        run: |
          if [ -z "$LOGGING_TOKEN" ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LOGGING_TOKEN secret not set - dashboards will show the waiting state (see docs/LIVE_LOGGING.md)"
            exit 0
          fi
          AUTH="$(printf 'x-access-token:%s' "$LOGGING_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          if git -c "http.extraheader=Authorization: Basic $AUTH" clone --quiet --depth 1 --branch ingest "https://github.com/${LOG_REPO}.git" ../logs 2>/dev/null; then
            rm -rf ../logs/.git
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "fetched $(find ../logs/ingest -name '*.json' 2>/dev/null | wc -l) log artefact(s) from ${LOG_REPO}"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${LOG_REPO} has no 'ingest' branch yet (no installed automation has reported) - waiting state"
          fi
      - name: Ingest, analyse, diagnose and build the live data
        id: ingest
        if: ${{ steps.logs.outputs.live == 'true' }}
        continue-on-error: true
        run: |
          mkdir -p live
          cp components/automation-registry/manifest.yaml live/manifest.yaml
          python -m automation_logging ingest --source dir --from "$GITHUB_WORKSPACE/../logs" --out live/archive
        working-directory: components/automation-logging
        env:
          PYTHONPATH: ${{ github.workspace }}/components/wrapper-core
      - name: Build the site (with the live data)
        id: site_live
        if: ${{ steps.ingest.outcome == 'success' }}
        continue-on-error: true
        env:
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
        run: |
          ARGS="--out site --fetch-installer-sha --live-data components/automation-logging/live"
          if [ "$REGISTRY_OUTCOME" = "success" ]; then ARGS="$ARGS --registry registry-out"; fi
          python tools/build_site.py $ARGS
      - name: Build the site without live data (no logs, or the live-data steps failed - the registry must still deploy)
        if: ${{ steps.site_live.outcome != 'success' }}
        env:
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
        run: |
          rm -rf site
          ARGS="--out site --fetch-installer-sha"
          if [ "$REGISTRY_OUTCOME" = "success" ]; then ARGS="$ARGS --registry registry-out"; fi
          python tools/build_site.py $ARGS
          if [ "${{ steps.logs.outputs.live }}" = "true" ]; then echo "::warning title=live data skipped::the live-data steps failed; the site was built without them"; fi
      - name: Check the generated site (links, install pages)
        run: python tools/check_site.py site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
