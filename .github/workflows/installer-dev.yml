name: installers

# Builds a REAL, self-contained per-user installer (.exe) for every example automation with NSIS on a Windows runner,
# smoke-tests the Python ones (silent install -> bundled payload -> scheduled task -> first run logged -> uninstall), and
# publishes them to the rolling GitHub Release `installers-latest`, which is what every Download button points to:
#   https://github.com/devpatel135/AutoStation/releases/download/installers-latest/<automation>-setup.exe
# The installers are UNSIGNED unless signing secrets are configured (Windows SmartScreen will warn: "More info -> Run anyway").
# Standalone by design: the payload is bundled inside the .exe and run logs stay in <install>\local-logs, so a download works
# before any registry / logging server exists. The registry (self-heal/updates) is https://devpatel135.github.io/AutoStation/registry/.
on:
  push:
    branches: [main]
    paths: ["components/automation-builder/**", "components/wrapper-core/**", "components/automations/**", ".github/workflows/installer-dev.yml"]
  workflow_dispatch:
    inputs:
      registry_url:
        description: Registry base URL baked into the installers (self-heal/updates)
        default: https://devpatel135.github.io/AutoStation/registry/
      log_remote:
        description: "'local' (default, standalone) or an ssh git remote for the logging repo"
        default: local
      ring:
        description: Default ring baked into the installers
        default: broad
      python_embed_url:
        description: python.org embeddable zip
        default: https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - automation: automation-hello-world
            smoke: true
          - automation: automation-invoice-router
            smoke: true
          - automation: automation-notifier
            smoke: false
          - automation: automation-portal-report
            smoke: false
    env:
      AUTOMATION: ${{ matrix.automation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jinja2 pytest pydantic
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Package wrapper-core + payload, write build config
        shell: bash
        run: |
          REG="${{ inputs.registry_url }}"; REG="${REG:-https://devpatel135.github.io/AutoStation/registry/}"
          LOG="${{ inputs.log_remote }}"; LOG="${LOG:-local}"
          RING="${{ inputs.ring }}"; RING="${RING:-broad}"
          EMB="${{ inputs.python_embed_url }}"; EMB="${EMB:-https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip}"
          mkdir -p build/stage/wrapper-core build/pkg vendor
          cp -r components/wrapper-core/wrapper_core build/stage/wrapper-core/
          cp components/wrapper-core/VERSION build/stage/wrapper-core/VERSION
          WV="$(tr -d '\r\n' < components/wrapper-core/VERSION)"
          python components/automation-builder/scripts/package.py component wrapper-core build/stage/wrapper-core --version "$WV" --out build/pkg
          V=$(python -c "import sys; sys.path.insert(0,'components/wrapper-core'); from wrapper_core import miniyaml; print(miniyaml.load('components/automations/$AUTOMATION/automation.yaml')['version'])")
          python components/automation-builder/scripts/package.py automation "$AUTOMATION" "components/automations/$AUTOMATION" --version "$V" --out build/pkg
          curl -fsSL -o vendor/python-embed.zip "$EMB"
          cat > build/build.json <<EOF
          {"automation": "$AUTOMATION", "version": "$V", "ring": "$RING",
           "registry_url": "$REG", "log_remote": "$LOG",
           "llm_endpoint": "", "publisher": "AutoStation",
           "wrapper_core_zip": "../build/pkg/components/wrapper-core-$WV.zip",
           "automation_zip": "../build/pkg/automations/$AUTOMATION-$V.zip",
           "python_embed_zip": "../vendor/python-embed.zip"}
          EOF
          echo "AUTOMATION_VERSION=$V" >> "$GITHUB_ENV"
      - name: Render + compile installer (NSIS)
        run: python components/automation-builder/scripts/build_installer.py --config build/build.json --out build/out --allow-missing-secrets --makensis "C:/Program Files (x86)/NSIS/makensis.exe"
      - name: Stage release files (stable + versioned names, sha256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = Get-ChildItem build/out -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { throw 'installer was not produced' }
          Copy-Item $exe.FullName "release/$env:AUTOMATION-setup.exe"
          Copy-Item $exe.FullName "release/$env:AUTOMATION-$env:AUTOMATION_VERSION-setup.exe"
          foreach ($f in Get-ChildItem release -Filter *.exe) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($f.FullName).sha256" -Value "$h  $($f.Name)" -Encoding ascii
          }
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.automation }}
          path: release/*
      - name: Smoke - silent per-user install (payload is bundled; no registry needed)
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $m = ($_.Exception.Message -replace '[\r\n]+', ' | ')
            Write-Host "::error title=smoke failed::$m"
            $h = Join-Path $env:LOCALAPPDATA 'AUTOMAGIX'
            if (Test-Path $h) { Get-ChildItem $h -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 60 -ExpandProperty FullName | Out-Host }
            Get-Content (Join-Path $h 'logs\wrapper.log') -ErrorAction SilentlyContinue | Select-Object -Last 40 | Out-Host
            exit 1
          }
          $p = Start-Process -FilePath "release/$env:AUTOMATION-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $home_ = Join-Path $env:LOCALAPPDATA 'AUTOMAGIX'
          foreach ($f in @('python\python.exe', 'wrapper-core\wrapper_core\__init__.py', "automations\$env:AUTOMATION\automation.yaml", 'state\installed.json', 'config\platform.json')) {
            if (-not (Test-Path (Join-Path $home_ $f))) { throw "missing after install: $f" }
          }
          Get-Content (Join-Path $home_ 'config\platform.json')
          schtasks /Query /TN "AUTOMAGIX\$env:AUTOMATION-daily" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'scheduled task was not registered' }
          Write-Host 'install OK'
          exit 0
      - name: Smoke - first run reaches the local log folder
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $m = ($_.Exception.Message -replace '[\r\n]+', ' | ')
            Write-Host "::error title=smoke failed::$m"
            Get-Content (Join-Path $env:LOCALAPPDATA 'AUTOMAGIX\logs\wrapper.log') -ErrorAction SilentlyContinue | Select-Object -Last 40 | Out-Host
            exit 1
          }
          $logs = Join-Path $env:LOCALAPPDATA 'AUTOMAGIX\local-logs'
          $deadline = (Get-Date).AddSeconds(150)
          $runs = @()
          while ((Get-Date) -lt $deadline) {
            $runs = @(Get-ChildItem -Recurse -Path $logs -Filter *.json -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'ingest[\\/][a-z]+[\\/]run[\\/]' })
            if ($runs.Count -gt 0) { break }
            Start-Sleep -Seconds 3
          }
          if ($runs.Count -eq 0) { throw 'no run log arrived in local-logs after install' }
          $rec = Get-Content $runs[0].FullName -Raw | ConvertFrom-Json
          Write-Host "first run: status=$($rec.status) items=$($rec.items.total) synopsis=$($rec.synopsis)"
          if ($rec.status -ne 'success') { throw "first run status was $($rec.status): $($rec.error | ConvertTo-Json -Compress)" }
          exit 0
      - name: Smoke - uninstall removes everything it installed
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $m = ($_.Exception.Message -replace '[\r\n]+', ' | ')
            Write-Host "::error title=smoke failed::$m"
            exit 1
          }
          $home_ = Join-Path $env:LOCALAPPDATA 'AUTOMAGIX'
          $un = Get-ChildItem $home_ -Filter 'uninstall-*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          schtasks /Query /TN "AUTOMAGIX\$env:AUTOMATION-daily" 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'scheduled task still registered after uninstall' }
          if (Test-Path (Join-Path $home_ "automations\$env:AUTOMATION")) { throw 'payload still present after uninstall' }
          Write-Host 'uninstall OK'
          exit 0

  publish:
    # Rolling pre-release that every Download button links to.
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          NOTES="Rolling release rebuilt on every change under components/. Stable names: <automation>-setup.exe (always the latest), plus versioned copies. SHA-256 files sit next to each installer. UNSIGNED unless signing is configured: Windows SmartScreen shows 'Windows protected your PC' -> More info -> Run anyway (verify the SHA-256 first). Per-user install, no admin rights."
          gh release view installers-latest >/dev/null 2>&1 || gh release create installers-latest --target "${{ github.sha }}" --prerelease --title "AutoStation installers (latest)" --notes "$NOTES"
          gh release edit installers-latest --notes "$NOTES" --prerelease
          gh release upload installers-latest dist/* --clobber
          gh release view installers-latest --json assets --jq '.assets[].name'
