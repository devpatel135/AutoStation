name: installers

# Builds the REAL, self-contained per-user installer (.exe) for the published automation with NSIS on a Windows runner,
# smoke-tests it (silent install -> bundled Node + Playwright -> scheduled task -> a real headless-Edge run of the automation
# against a local demo page -> logs -> uninstall) and publishes it to the rolling GitHub Release `installers-latest`, which is
# what every Download button points to:
#   https://github.com/<owner>/<repo>/releases/download/installers-latest/<automation>-setup.exe
#
# The installer contains: embedded Python + wrapper-core, the execution-framework with a Node runtime and playwright-core,
# and the automation payload. Nothing needs to be installed first. Updates then arrive through the registry
# (https://<owner>.github.io/<repo>/registry/), which every run and every sign-in checks.
#
# LIVE LOGGING: if the repository secret LOGGING_TOKEN exists, the installer is built "connected": every run's log,
# heartbeat and failure evidence is pushed over HTTPS to the private logs repo <owner>/AutoStation-logs (override with the
# variable AUTOSTATION_LOG_REPO). Without the secret it is a standalone build and logs stay in <install>\local-logs.
# Unsigned installers trigger Windows SmartScreen ("More info -> Run anyway"); compare the published SHA-256 first.
# WHEN IT RUNS: after every SUCCESSFUL `release` (workflow_run): the release already proved that no released package changed without a
# version bump, and an installer is only ever built from that state. A push re-runs it only when the installer itself changes (builder,
# its helper tools, this workflow, the shared smoke script). Package changes therefore build the installer exactly once, via the release.
# Builds are serialized (concurrency) so two runs can never publish out of order.
on:
  push:
    branches: [main]
    paths:
      - "components/automation-builder/**"
      - "tools/build_framework_bundle.py"
      - "tools/fetch_mingit.py"
      - "tools/ci/smoke-installer.ps1"
      - ".github/workflows/installer-dev.yml"
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ring:
        description: Default ring baked into the installer
        default: broad

permissions:
  contents: read

concurrency:
  group: installers
  cancel-in-progress: false

env:
  AUTOMATION: automation-certification-site
  # Pinned: the installer bundles this interpreter, so it is verified byte-for-byte (python.org publishes no signature for embed zips).
  PY_EMBED_URL: https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip
  PY_EMBED_SHA256: 0d57bb6cb078b74d23dbfe91f77d6780d45bed328911609f1f7ee2ba1606bf44

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2025     # pinned: the installer must not change with the runner image
    environment: production
    timeout-minutes: 40
    env:
      INPUT_RING: ${{ inputs.ring }}
      REGISTRY_PUBKEY: ${{ vars.AUTOSTATION_REGISTRY_PUBKEY }}   # public key; set by tools/setup_live.py once the manifest is signed
      LOG_TOKEN_SET: ${{ secrets.LOGGING_TOKEN != '' }}
      LOG_REPO: ${{ vars.AUTOSTATION_LOG_REPO || format('{0}/AutoStation-logs', github.repository_owner) }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/registry/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # Node stays on 20: the npm that builds the node_modules shipped inside the framework is part of the package content (see release.yml)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: python -m pip install -c requirements-ci.txt jinja2 pytest pydantic
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Bundle Node + playwright-core into the execution-framework
        run: python tools/build_framework_bundle.py
      - name: Package wrapper-core, execution-framework and the payload; write the build config
        shell: bash
        run: |
          RING="${INPUT_RING:-broad}"
          case "$RING" in dev|pilot|broad) ;; *) echo "::error::invalid ring"; exit 1 ;; esac
          if [ "$LOG_TOKEN_SET" = "true" ]; then LOG="$LOG_REPO"; echo "connected build: logs go to $LOG_REPO"; else LOG="local"; echo "::notice::LOGGING_TOKEN secret not set: building a STANDALONE installer (logs stay on the machine)"; fi
          mkdir -p build/stage/wrapper-core build/pkg vendor
          cp -r components/wrapper-core/wrapper_core build/stage/wrapper-core/
          cp components/wrapper-core/VERSION build/stage/wrapper-core/VERSION
          WV="$(tr -d '\r\n' < components/wrapper-core/VERSION)"
          FV="$(tr -d '\r\n' < components/execution-framework/VERSION)"
          python components/automation-builder/scripts/package.py component wrapper-core build/stage/wrapper-core --version "$WV" --out build/pkg
          python -c "import sys; sys.path.insert(0,'tools'); import build_registry as br; from pathlib import Path; print(br._stage_framework(Path('components/execution-framework'), Path('build/stage')))"
          python components/automation-builder/scripts/package.py component execution-framework build/stage/execution-framework --version "$FV" --out build/pkg
          V=$(python -c "import sys; sys.path.insert(0,'components/wrapper-core'); from wrapper_core import miniyaml; print(miniyaml.load('components/automations/$AUTOMATION/automation.yaml')['version'])")
          python components/automation-builder/scripts/package.py automation "$AUTOMATION" "components/automations/$AUTOMATION" --version "$V" --out build/pkg
          curl -fsSL -o vendor/python-embed.zip "$PY_EMBED_URL"
          echo "$PY_EMBED_SHA256  vendor/python-embed.zip" | sha256sum -c -
          python tools/fetch_mingit.py --out vendor/mingit.zip
          cat > build/build.json <<EOF
          {"automation": "$AUTOMATION", "version": "$V", "ring": "$RING",
           "registry_url": "$PAGES_URL", "log_remote": "$LOG",
           "llm_endpoint": "", "publisher": "AutoStation",
           "wrapper_core_zip": "../build/pkg/components/wrapper-core-$WV.zip",
           "framework_zip": "../build/pkg/components/execution-framework-$FV.zip",
           "automation_zip": "../build/pkg/automations/$AUTOMATION-$V.zip",
           "git_zip": "../vendor/mingit.zip", "registry_pubkeys": "$REGISTRY_PUBKEY",
           "python_embed_zip": "../vendor/python-embed.zip"}
          EOF
          echo "AUTOMATION_VERSION=$V" >> "$GITHUB_ENV"
      - name: Render + compile the installer (NSIS)
        env:
          LOGGING_TOKEN: ${{ secrets.LOGGING_TOKEN }}
        run: python components/automation-builder/scripts/build_installer.py --config build/build.json --out build/out --allow-missing-secrets --makensis "C:/Program Files (x86)/NSIS/makensis.exe"
      - name: Stage release files (stable + versioned names, sha256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = Get-ChildItem build/out -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { throw 'installer was not produced' }
          Copy-Item $exe.FullName "release/$env:AUTOMATION-setup.exe"
          Copy-Item $exe.FullName "release/$env:AUTOMATION-$env:AUTOMATION_VERSION-setup.exe"
          foreach ($f in Get-ChildItem release -Filter *.exe) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($f.FullName).sha256" -Value "$h  $($f.Name)" -Encoding ascii
          }
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: release/*
      # The smoke checks live in ONE place (tools/ci/smoke-installer.ps1), also used by canary.yml after publishing.
      - name: Smoke - silent per-user install (everything is bundled; nothing else installed)
        shell: pwsh
        run: ./tools/ci/smoke-installer.ps1 -Phase install -Automation $env:AUTOMATION -Installer "release/$env:AUTOMATION-setup.exe" -ExpectConnected:($env:LOG_TOKEN_SET -eq 'true')
      - name: Smoke - a real run of the installed automation (bundled Node + Playwright + Edge) against a local demo page
        shell: pwsh
        run: ./tools/ci/smoke-installer.ps1 -Phase run -Automation $env:AUTOMATION
      - name: Smoke - uninstall removes everything it installed
        shell: pwsh
        run: ./tools/ci/smoke-installer.ps1 -Phase uninstall -Automation $env:AUTOMATION

  publish:
    # Rolling pre-release that every Download button links to. Older versioned installers are kept (newest 5) so a bad release can be rolled back by hand.
    needs: build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_run') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the built installer (after checkout, because checkout cleans untracked files)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist
      - name: Software bill of materials (CycloneDX) and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/make_sbom.py --out dist/autostation-sbom.cdx.json --version "$GITHUB_SHA"
          gh release view installers-latest --json body --jq .body > prev-body.md 2>/dev/null || : > prev-body.md
          SHA256="$(cut -d' ' -f1 "dist/${AUTOMATION}-setup.exe.sha256")"
          python3 tools/release_notes.py --out notes.md --prev-body-file prev-body.md --head "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --installer-name "${AUTOMATION}-setup.exe" --installer-sha256 "$SHA256"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance (verify with gh attestation verify, see docs/SECURITY.md)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/autostation-sbom.cdx.json
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view installers-latest >/dev/null 2>&1 || gh release create installers-latest --target "${{ github.sha }}" --prerelease --title "AutoStation installers (latest)" --notes-file notes.md
          gh release edit installers-latest --notes-file notes.md --prerelease
          # Upload order matters because exe and .sha256 cannot be replaced atomically: versioned (immutable) files first, then the stable
          # exe, then its .sha256 - the window in which a download and its digest disagree is a few seconds, and the canary retries it.
          for f in $(ls dist | grep -E -- '-[0-9]+[.][0-9]+[.][0-9]+'); do gh release upload installers-latest "dist/$f" --clobber; done
          gh release upload installers-latest "dist/${AUTOMATION}-setup.exe" --clobber
          gh release upload installers-latest "dist/${AUTOMATION}-setup.exe.sha256" --clobber
          for f in $(ls dist | grep -v -E -- "-[0-9]+[.][0-9]+[.][0-9]+|^${AUTOMATION}-setup[.]exe"); do gh release upload installers-latest "dist/$f" --clobber; done
          # Keep the newest 5 versioned installers (each with its .sha256); prune only older ones. The stable names and everything just
          # uploaded are never touched. (Previously every asset not in this build was deleted, including all older versioned installers.)
          gh release view installers-latest --json assets --jq '.assets[].name' \
            | grep -E "^${AUTOMATION}-[0-9]+[.][0-9]+[.][0-9]+-setup[.]exe$" | sort -V | head -n -5 \
            | while read -r old; do
                echo "pruning old versioned installer ${old}"
                gh release delete-asset installers-latest "${old}" -y
                gh release delete-asset installers-latest "${old}.sha256" -y || true
              done
          gh release view installers-latest --json assets --jq '.assets[].name'

