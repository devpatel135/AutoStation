name: installer-dev

# Builds an UNSIGNED, dev-ring per-user installer with NSIS on a Windows runner, so the installer path is verified in CI
# even if your GitLab/Docker pipeline is not set up yet. Secrets (logging SSH key, registry token) are optional here; real
# release builds use components/automation-builder/.gitlab-ci.yml with protected CI variables and --require-signing.
on:
  workflow_dispatch:
    inputs:
      automation:
        description: Automation payload to wrap (directory name under components/automations)
        default: automation-hello-world
      registry_url:
        description: Registry base URL or UNC/local path the endpoint reads manifest.yaml from
        default: https://example.invalid/registry/
      log_remote:
        description: Logging repo SSH URL (git@host:group/automation-logging.git)
        default: git@example.invalid:platform/automation-logging.git
      python_embed_url:
        description: python.org embeddable zip
        default: https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jinja2 pytest
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Package wrapper-core and the automation
        shell: bash
        run: |
          mkdir -p build/stage/wrapper-core build/pkg vendor
          cp -r components/wrapper-core/wrapper_core build/stage/wrapper-core/
          cp components/wrapper-core/VERSION build/stage/wrapper-core/VERSION
          python components/automation-builder/scripts/package.py component wrapper-core build/stage/wrapper-core \
            --version "$(tr -d '\r\n' < components/wrapper-core/VERSION)" --out build/pkg
          A="${{ inputs.automation }}"
          V=$(python -c "import sys; sys.path.insert(0,'components/wrapper-core'); from wrapper_core import miniyaml; print(miniyaml.load('components/automations/$A/automation.yaml')['version'])")
          python components/automation-builder/scripts/package.py automation "$A" "components/automations/$A" --version "$V" --out build/pkg
          curl -fsSL -o vendor/python-embed.zip "${{ inputs.python_embed_url }}"
          cat > build/build.json <<EOF
          {"automation": "$A", "version": "$V", "ring": "dev",
           "registry_url": "${{ inputs.registry_url }}", "log_remote": "${{ inputs.log_remote }}",
           "llm_endpoint": "", "publisher": "AutoStation (dev build)",
           "wrapper_core_zip": "../build/pkg/components/wrapper-core-$(tr -d '\r\n' < components/wrapper-core/VERSION).zip",
           "python_embed_zip": "../vendor/python-embed.zip"}
          EOF
      - name: Render + compile installer (unsigned, dev)
        run: python components/automation-builder/scripts/build_installer.py --config build/build.json --out build/out --ring dev --allow-missing-secrets
      - uses: actions/upload-artifact@v4
        with:
          name: installer-dev
          path: build/out/*
