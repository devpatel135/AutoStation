name: release

# Packages every component + automation, publishes NEW immutable zips to the append-only `registry-artifacts` branch and opens a
# pull request with the regenerated manifest (new versions enter the DEV ring only; promotion is a human PR - see docs/PIPELINES.md).
# Installers are NOT built here: the `installer-dev` workflow owns the rolling `installers-latest` release.
on:
  push:
    branches: [main]
    paths: ["components/**", "tools/build_registry.py", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run: seed a complete manifest from the repo (current version goes into every ring)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OPS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pydantic jinja2
      - name: Test the platform before releasing anything
        run: python tools/test_all.py
      - name: Fetch the published artifacts branch (empty on the first run)
        id: artifacts
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" registry-artifacts >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch registry-artifacts "$URL" ../ra
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            mkdir ../ra
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry-artifacts does not exist yet: this run bootstraps it"
          fi
      - name: Build the registry (immutability + dev-ring rules enforced)
        id: build
        run: |
          BOOT=""
          if [ "$BOOTSTRAP_INPUT" = "true" ] || [ "${{ steps.artifacts.outputs.exists }}" = "false" ]; then BOOT="--bootstrap"; fi
          python tools/build_registry.py --out registry-out --artifacts-dir ../ra --new-dir new-artifacts \
            --write-manifest components/automation-registry/manifest.yaml $BOOT
      - name: Publish new packages to registry-artifacts (append-only)
        if: ${{ steps.build.outputs.new != '0' }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd ../ra
          if [ ! -d .git ]; then git init -q -b registry-artifacts; git remote add origin "$URL"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p artifacts
          cp -r "$GITHUB_WORKSPACE/new-artifacts/artifacts/." artifacts/
          if [ ! -f README.md ]; then
            printf '# registry-artifacts\n\nAppend-only store of released package zips. Never edit or delete files here; released versions are immutable.\nPublished through https://github.com/%s/actions/workflows/release.yml\n' "$GITHUB_REPOSITORY" > README.md
          fi
          git add -A
          if git diff --cached --name-status | grep -v '^A' | grep -q .; then
            echo "::error::registry-artifacts is append-only; refusing to modify or delete existing files"
            git diff --cached --name-status
            exit 1
          fi
          git commit -q -m "release ${GITHUB_SHA::7}: $(git diff --cached --name-only | wc -l) package file(s)" || true
          git push origin HEAD:registry-artifacts
      - name: Open or refresh the dev-ring pull request
        if: ${{ steps.build.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B registry/auto-dev-ring
          git add components/automation-registry/manifest.yaml
          git commit -q -m "registry: dev-ring update from ${GITHUB_SHA::7}" || { echo "nothing to commit"; exit 0; }
          git push --force origin registry/auto-dev-ring
          {
            echo "Automatic registry update from \`${GITHUB_SHA::7}\`."
            echo
            echo "- New versions are assigned to the **dev** ring only."
            echo "- Review the manifest diff, then promote with \`python -m registry promote <name> --to pilot\` (or the admin panel)."
            echo "- Packages are already published (immutable) on the \`registry-artifacts\` branch."
          } > pr-body.md
          if [ "$(gh pr list --head registry/auto-dev-ring --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head registry/auto-dev-ring --title "registry: dev-ring update" --body-file pr-body.md
          else
            gh pr edit registry/auto-dev-ring --body-file pr-body.md
          fi
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Registry release"
            echo
            echo "- new packages: ${{ steps.build.outputs.new }}"
            echo "- manifest changed: ${{ steps.build.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: registry-out
          path: registry-out
          retention-days: 7
