name: release

# Continuous delivery of the registry that every installed machine self-heals from.
# On every push to main that touches a component/automation: test -> bundle the Node runtime into the execution-framework ->
# package everything (deterministic zips) -> publish NEW immutable zips to the append-only `registry-artifacts` branch ->
# regenerate manifest.yaml with the new versions in EVERY ring (auto-promote) and commit it to main -> the `site` workflow
# republishes https://<owner>.github.io/<repo>/registry/ . Machines pick the new version up on their next run / sign-in.
# A released version is immutable: change code => bump `version` (automation.yaml) or VERSION (components), or this fails loudly.
on:
  push:
    branches: [main]
    paths:
      - "components/automations/**"
      - "components/wrapper-core/**"
      - "components/execution-framework/**"
      - "components/automation-registry/**"
      - "tools/build_registry.py"
      - "tools/build_framework_bundle.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Rebuild the manifest from scratch from the repo (drops automations that are no longer in components/automations)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  registry:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04      # pinned: -latest moves under us (Ubuntu 26 migration); the release must not change with the image
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}   # the write token is given only to the steps that push, never to the test run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # Node stays on 20 HERE on purpose: the framework package contains node_modules (incl. npm's hidden lockfile), so the npm that
      # builds it is part of the released content; moving it is a deliberate framework version bump, not a CI tidy-up.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: python -m pip install -c requirements-ci.txt pytest pydantic jinja2
      - name: Test the platform before releasing anything
        run: python tools/test_all.py
      - name: Bundle Node + playwright-core into the execution-framework (the shipped runtime)
        run: python tools/build_framework_bundle.py
      - name: Fetch the published artifacts branch (empty on the first run)
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # exit 0 = the branch exists, exit 2 = it really is absent (the ONLY case that may bootstrap); anything else is a transient
          # failure and must fail the job: guessing 'absent' would bootstrap over a registry that exists
          rc=0
          git ls-remote --exit-code --heads "$URL" registry-artifacts >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0)
              git clone --quiet --depth 1 --branch registry-artifacts "$URL" ../ra
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              mkdir ../ra
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::registry-artifacts does not exist yet: this run bootstraps it"
              ;;
            *)
              echo "::error title=cannot read the repository::git ls-remote failed (exit ${rc}); refusing to assume that registry-artifacts is absent"
              exit 1
              ;;
          esac
      - name: Build the registry (immutability rules enforced; new versions go to every ring)
        id: build
        run: |
          BOOT=""
          if [ "$BOOTSTRAP_INPUT" = "true" ] || [ "${{ steps.artifacts.outputs.exists }}" = "false" ]; then BOOT="--bootstrap"; fi
          python tools/build_registry.py --out registry-out --artifacts-dir ../ra --new-dir new-artifacts \
            --write-manifest components/automation-registry/manifest.yaml --auto-promote $BOOT
      - name: Publish new packages to registry-artifacts (append-only)
        if: ${{ steps.build.outputs.new != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd ../ra
          if [ ! -d .git ]; then git init -q -b registry-artifacts; git remote add origin "$URL"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p artifacts
          cp -r "$GITHUB_WORKSPACE/new-artifacts/artifacts/." artifacts/
          if [ ! -f README.md ]; then
            printf '# registry-artifacts\n\nAppend-only store of released package zips. Never edit or delete files here; released versions are immutable.\n' > README.md
          fi
          git add -A
          if git diff --cached --name-status | grep -v '^A' | grep -q .; then
            echo "::error::registry-artifacts is append-only; refusing to modify or delete existing files"
            git diff --cached --name-status
            exit 1
          fi
          git commit -q -m "release ${GITHUB_SHA::7}: $(git diff --cached --name-only | wc -l) package file(s)" || true
          git push origin HEAD:registry-artifacts
      - name: Commit the regenerated manifest to main (all rings follow main)
        if: ${{ steps.build.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/automation-registry/manifest.yaml components/automation-registry/history 2>/dev/null || git add components/automation-registry/manifest.yaml
          git commit -q -m "registry: release ${GITHUB_SHA::7} to all rings [skip ci]" || { echo "nothing to commit"; exit 0; }
          # another writer (an ops-action merge, a human push) may have moved main while this run was building: rebase and retry
          for attempt in 1 2 3 4 5; do
            git -c "http.extraheader=Authorization: Basic $AUTH" pull --rebase --quiet origin main
            if git -c "http.extraheader=Authorization: Basic $AUTH" push origin HEAD:main; then exit 0; fi
            echo "push lost a race (attempt ${attempt}); retrying"
            sleep $((attempt * 3))
          done
          echo "::error title=manifest not committed::main kept moving; the artifacts are published, re-run this workflow to commit the manifest"
          exit 1
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Registry release"
            echo
            echo "- new packages: ${{ steps.build.outputs.new }}"
            echo "- manifest changed: ${{ steps.build.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-out
          path: registry-out
          retention-days: 7
