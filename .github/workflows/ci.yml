name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    # supply-chain + secret hygiene gates: every action pinned to a commit SHA, no credentials committed, workflow rules enforced
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python tools/check_workflows.py
      - run: python tools/pin_actions.py --check
      - run: python tools/check_secrets.py
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pydantic jinja2
      - name: Test every Python component
        run: python tools/test_all.py

  node:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Syntax check every JS file
        shell: bash
        run: find components -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: Framework + automation tests
        run: |
          cd components/execution-framework && node --test
          cd ../automations/automation-certification-site && node --test

  integration:
    needs: python
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pydantic jinja2
      - name: End-to-end platform walkthrough (package -> registry -> run -> ingest -> analytics -> dashboard -> notifier)
        run: python tools/e2e_demo.py --out e2e-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dashboard
          path: e2e-out/public
