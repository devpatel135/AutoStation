name: pages-demo

# Publishes the end-to-end demo (fleet dashboard + registry portal/admin panel built from simulated machines) to GitHub
# Pages so you can see the control plane without GitLab. Enable once: Settings -> Pages -> Source: GitHub Actions.
# Production uses the GitLab Pages pipelines in components/automation-logging and components/automation-registry.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pydantic jinja2
      - run: python tools/e2e_demo.py --out e2e-out
      - run: |
          mkdir -p site
          cp -r e2e-out/public site/dashboard
          cp -r e2e-out/portal site/portal
          printf '<!doctype html><meta charset=utf-8><title>AutoStation demo</title><h1>AutoStation demo</h1><ul><li><a href="dashboard/">Fleet dashboard</a></li><li><a href="portal/">Registry portal + admin panel</a></li></ul>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
