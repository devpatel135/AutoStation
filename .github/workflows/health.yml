name: health

# Proactive operations. Every 30 minutes: fetch the live run logs (private logs repo), recompute the fleet signals
# (SILENT, MISSED, HUNG, VERSION_DRIFT, ...) and keep GitHub issues in sync with them - one `ops-signal` issue per signal
# (opened, commented on recurrence, reopened if it returns within 14 days, closed automatically when the signal clears).
# Without LOGGING_TOKEN, or while the logs repo has no data yet, it does nothing and closes nothing (a missing data source
# must never look like "all clear"). Closing is also gated on the report itself (tools/ops_issues.py report_trust: enough records,
# fresh, few rejects, no failed signal builder) and needs TWO consecutive clean runs (label signal-clearing). Telemetry is advisory and untrusted: tools/ops_issues.py sanitises every field.
# Operator guide: docs/PIPELINES.md ("ops-signal issues"). Also runs when this file or tools/ops_issues.py changes on main (scheduled runs can be late).
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/health.yml"
      - "tools/ops_issues.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  signals:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      LOG_REPO: ${{ vars.AUTOSTATION_LOG_REPO || format('{0}/AutoStation-logs', github.repository_owner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore the analytics state (target-change tracking for drift signals)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: health-state
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-
      - name: Fetch the run logs (private logs repo, the last two monthly branches)
        id: logs
        env:
          # read-only token preferred (LOGS_READ_TOKEN); the installer's read/write token is the fallback
          LOGGING_TOKEN: ${{ secrets.LOGS_READ_TOKEN || secrets.LOGGING_TOKEN }}
        run: |
          if [ -z "$LOGGING_TOKEN" ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no LOGGING_TOKEN or LOGS_READ_TOKEN secret - nothing to monitor yet (see docs/LIVE_LOGGING.md)"
            exit 0
          fi
          if python tools/fetch_logs.py --remote "https://github.com/${LOG_REPO}.git" --out logs-src --months 2 --token-env LOGGING_TOKEN; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no run logs could be fetched from ${LOG_REPO} (nothing has reported yet, or the fetch failed) - nothing is closed"
          fi
      - name: Ingest and compute the signals
        id: analyze
        if: ${{ steps.logs.outputs.live == 'true' }}
        working-directory: components/automation-logging
        env:
          PYTHONPATH: ${{ github.workspace }}/components/wrapper-core
        run: |
          mkdir -p "$GITHUB_WORKSPACE/health-state" "$GITHUB_WORKSPACE/health-out"
          complete=true
          # exit 3 = data was deferred or many records were rejected: the signals are still computed, but the report is not
          # trustworthy enough to CLOSE issues (a signal can be missing only because its data was not read)
          rc=0
          python -m automation_logging ingest --source dir --from "$GITHUB_WORKSPACE/logs-src" --out "$GITHUB_WORKSPACE/health-out/archive" || rc=$?
          if [ "$rc" = "3" ]; then complete=false; elif [ "$rc" != "0" ]; then exit "$rc"; fi
          rc=0
          python -m automation_logging analyze --archive "$GITHUB_WORKSPACE/health-out/archive" --manifest "$GITHUB_WORKSPACE/components/automation-registry/manifest.yaml" --state "$GITHUB_WORKSPACE/health-state" --out "$GITHUB_WORKSPACE/health-out/report.json" --fail-on-data-quality || rc=$?
          if [ "$rc" = "3" ]; then complete=false; elif [ "$rc" != "0" ]; then exit "$rc"; fi
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then echo "::warning title=incomplete telemetry::issues can be opened or updated but will not be closed in this run"; fi
      - name: Sync the ops-signal issues
        if: ${{ steps.analyze.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_COMPLETE: ${{ steps.analyze.outputs.complete }}
        run: |
          OK=""
          if [ "$DATA_COMPLETE" = "true" ]; then OK="--live-data-ok"; fi
          python tools/ops_issues.py sync --signals health-out/report.json $OK --max-new 5 --max-open 50 --min-severity high
