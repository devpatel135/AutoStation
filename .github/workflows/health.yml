name: health

# Proactive operations. Every 30 minutes: fetch the live run logs (private logs repo), recompute the fleet signals
# (SILENT, MISSED, HUNG, VERSION_DRIFT, ...) and keep GitHub issues in sync with them - one `ops-signal` issue per signal
# (opened, commented on recurrence, reopened if it returns within 14 days, closed automatically when the signal clears).
# Without LOGGING_TOKEN, or while the logs repo has no data yet, it does nothing and closes nothing (a missing data source
# must never look like "all clear"). Closing is also gated on the report itself (tools/ops_issues.py report_trust: enough records,
# fresh, few rejects, no failed signal builder) and needs TWO consecutive clean runs (label signal-clearing). Telemetry is advisory and untrusted: tools/ops_issues.py sanitises every field.
# Operator guide: docs/PIPELINES.md ("ops-signal issues").
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  signals:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      LOG_REPO: ${{ vars.AUTOSTATION_LOG_REPO || format('{0}/AutoStation-logs', github.repository_owner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore the analytics state (target-change tracking for drift signals)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: health-state
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-
      - name: Fetch the live run logs (private logs repo, branch ingest)
        id: logs
        env:
          # read-only token preferred (LOGS_READ_TOKEN); the installer's read/write token is the fallback
          LOGGING_TOKEN: ${{ secrets.LOGS_READ_TOKEN || secrets.LOGGING_TOKEN }}
        run: |
          if [ -z "$LOGGING_TOKEN" ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LOGGING_TOKEN is not set - nothing to monitor yet (see docs/LIVE_LOGGING.md)"
            exit 0
          fi
          AUTH="$(printf 'x-access-token:%s' "$LOGGING_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          if git -c "http.extraheader=Authorization: Basic $AUTH" clone --quiet --depth 1 --branch ingest "https://github.com/${LOG_REPO}.git" ../logs 2>/dev/null; then
            rm -rf ../logs/.git
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "fetched $(find ../logs/ingest -name '*.json' 2>/dev/null | wc -l) log artefact(s)"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${LOG_REPO} has no ingest branch yet - nothing has reported, so nothing is closed"
          fi
      - name: Ingest and compute the signals
        id: analyze
        if: ${{ steps.logs.outputs.live == 'true' }}
        working-directory: components/automation-logging
        env:
          PYTHONPATH: ${{ github.workspace }}/components/wrapper-core
        run: |
          mkdir -p "$GITHUB_WORKSPACE/health-state" "$GITHUB_WORKSPACE/health-out"
          python -m automation_logging ingest --source dir --from "$GITHUB_WORKSPACE/../logs" --out "$GITHUB_WORKSPACE/health-out/archive"
          python -m automation_logging analyze --archive "$GITHUB_WORKSPACE/health-out/archive" \
            --manifest "$GITHUB_WORKSPACE/components/automation-registry/manifest.yaml" \
            --state "$GITHUB_WORKSPACE/health-state" --out "$GITHUB_WORKSPACE/health-out/report.json"
      - name: Sync the ops-signal issues
        if: ${{ steps.analyze.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ops_issues.py sync --signals health-out/report.json --live-data-ok --max-new 5 --max-open 50 --min-severity high
