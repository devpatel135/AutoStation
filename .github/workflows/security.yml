name: security

# Supply-chain and posture checks that need no third-party actions. Weekly, on manual run, and on pull requests that touch dependencies or workflows.
#   audit   known-vulnerability audit of the Python and npm dependencies (soft-fails with a notice if the public index is unreachable, so an
#           outage never reads as a vulnerability), plus tools/check_posture.py (policy files, pinned actions, rulesets and secret scanning
#           when the token can see them) and a CycloneDX SBOM kept as an artifact
#   review  dependency-review (GitHub-owned) on pull requests: blocks newly introduced vulnerable or disallowed dependencies
on:
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/**"
      - "tools/pin_actions.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Security posture (policy files, pinned actions, workflow rules, secrets scan, live repo settings)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet pyyaml || echo "::notice::pyyaml unavailable - the real-YAML workflow check is skipped"
          python tools/check_posture.py --repo "$GITHUB_REPOSITORY"
      - name: Audit the Python dependencies
        if: ${{ !cancelled() }}
        run: |
          if ! python -m pip install --quiet "pip-audit==2.7.3"; then
            echo "::notice::pip-audit could not be installed (index unreachable) - Python audit skipped this run"
            exit 0
          fi
          rc=0
          python -m pip_audit --requirement components/automation-builder/docker/requirements.txt --progress-spinner off > pip-audit.txt 2>&1 || rc=$?
          cat pip-audit.txt
          if [ "$rc" -ne 0 ]; then
            # a network failure is not a vulnerability: only skip when the tool never got as far as reporting findings
            if grep -qiE "connection|timed out|temporary failure|name resolution|max retries|network" pip-audit.txt && ! grep -qiE "found [0-9]+ known vulnerabilit" pip-audit.txt; then
              echo "::notice::pip-audit could not reach the vulnerability service - Python audit skipped this run"
              exit 0
            fi
            exit "$rc"
          fi
      - name: Audit the npm dependencies of the execution-framework (production only)
        if: ${{ !cancelled() }}
        working-directory: components/execution-framework
        run: |
          REG=https://registry.npmjs.org/
          if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry "$REG"; then
            echo "::notice::npm registry unreachable - npm audit skipped this run"
            exit 0
          fi
          rc=0
          npm audit --omit=dev --audit-level=high --registry "$REG" > npm-audit.txt 2>&1 || rc=$?
          cat npm-audit.txt
          if [ "$rc" -ne 0 ]; then
            if grep -qE "ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|audit endpoint|network" npm-audit.txt && ! grep -qiE "[0-9]+ (critical|high|moderate|low)" npm-audit.txt; then
              echo "::notice::npm audit could not reach the advisory service - skipped this run"
              exit 0
            fi
            exit "$rc"
          fi
      - name: Software bill of materials
        if: ${{ !cancelled() }}
        run: python tools/make_sbom.py --out autostation-sbom.cdx.json --version "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: autostation-sbom.cdx.json
          retention-days: 90

  review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
