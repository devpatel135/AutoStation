name: promote

# Staged rollout. release.yml puts every NEW version in ring dev only. This workflow moves a version ONE ring up per run
# (dev -> pilot -> broad) when tools/promote_gate.py says so:
#   - it has soaked in the source ring (repository variables AUTOSTATION_SOAK_PILOT_H, default 6, and AUTOSTATION_SOAK_BROAD_H, default 24),
#   - the live health report is fresh and trustworthy and holds no FAILED / HUNG / REGRESSION_AFTER_RELEASE / ERROR_BUDGET_BURN signal for it
#     (MACHINE_UNHEALTHY holds back the shared components),
#   - no open ops-signal issue names it and no delivery-pipeline alert (release, site, site-verify, installers, canary) is open.
# When a package is blocked for a reason other than soaking for more than 24 hours, ONE ops issue (promote-stuck-<name>) is raised; it closes
# itself when the block clears. Pause, rollback and fleet-pause are never gated: they are manifest edits (ops-action.yml) that go straight out.
# Manual override: run ops-action (promote) for a package, or run this workflow with dry_run to see the decision without changing anything.
# Runs from main only. The bot commits the manifest (and components/automation-registry/rollout-state.json, the first-seen times the soak
# is counted from) with the same rebase and retry pattern as release.yml, then asks the site workflow to republish the registry.
# GitHub cron is best-effort (an odd minute avoids the busiest start times); a late or skipped run only delays a promotion.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Only consider this package (component or automation name); empty = all"
        type: string
        default: ""
      dry_run:
        description: "Decide and report only; change nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      LOG_REPO: ${{ vars.AUTOSTATION_LOG_REPO || format('{0}/AutoStation-logs', github.repository_owner) }}
      AUTOSTATION_SOAK_PILOT_H: ${{ vars.AUTOSTATION_SOAK_PILOT_H }}
      AUTOSTATION_SOAK_BROAD_H: ${{ vars.AUTOSTATION_SOAK_BROAD_H }}
      PACKAGE_INPUT: ${{ inputs.package }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate the inputs
        id: args
        run: |
          ONLY=""
          if [ -n "$PACKAGE_INPUT" ]; then
            if ! printf '%s' "$PACKAGE_INPUT" | grep -Eq '^[a-z0-9][a-z0-9-]{0,63}$'; then
              echo "::error title=bad input::package must be a component or automation name"
              exit 1
            fi
            ONLY="$PACKAGE_INPUT"
          fi
          DRY="false"
          if [ "$DRY_RUN_INPUT" = "true" ]; then DRY="true"; fi
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"
          echo "dry=${DRY}" >> "$GITHUB_OUTPUT"
      - name: Restore the analytics state (separate from health.yml)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: promote-state
          key: promote-state-${{ github.run_id }}
          restore-keys: promote-state-
      - name: Fetch the run logs and compute the live health report
        id: health
        env:
          LOGGING_TOKEN: ${{ secrets.LOGS_READ_TOKEN || secrets.LOGGING_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/components/wrapper-core
        run: |
          # No token or no data is NOT a failure here: the gate then sees "no health report" and promotes nothing (a missing data source
          # must never look healthy).
          echo "report=false" >> "$GITHUB_OUTPUT"
          if [ -z "$LOGGING_TOKEN" ]; then
            echo "::notice::no LOGGING_TOKEN or LOGS_READ_TOKEN secret: no health data, so nothing can be promoted"
            exit 0
          fi
          mkdir -p promote-state promote-out
          if ! python tools/fetch_logs.py --remote "https://github.com/${LOG_REPO}.git" --out logs-src --months 2 --token-env LOGGING_TOKEN; then
            echo "::warning::the run logs could not be fetched: nothing is promoted this run"
            exit 0
          fi
          cd components/automation-logging
          rc=0
          python -m automation_logging ingest --source dir --from "$GITHUB_WORKSPACE/logs-src" --out "$GITHUB_WORKSPACE/promote-out/archive" || rc=$?
          if [ "$rc" != "0" ] && [ "$rc" != "3" ]; then echo "::warning::ingest failed (exit ${rc})"; exit 0; fi
          rc=0
          python -m automation_logging analyze --archive "$GITHUB_WORKSPACE/promote-out/archive" \
            --manifest "$GITHUB_WORKSPACE/components/automation-registry/manifest.yaml" --state "$GITHUB_WORKSPACE/promote-state" \
            --out "$GITHUB_WORKSPACE/promote-out/report.json" --fail-on-data-quality || rc=$?
          # exit 3 = incomplete data: the report is still written; the gate judges its data_quality section itself
          if [ "$rc" != "0" ] && [ "$rc" != "3" ]; then echo "::warning::analyze failed (exit ${rc})"; exit 0; fi
          echo "report=true" >> "$GITHUB_OUTPUT"
      - name: Decide and promote
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ steps.args.outputs.only }}
          DRY: ${{ steps.args.outputs.dry }}
          HAVE_REPORT: ${{ steps.health.outputs.report }}
        run: |
          ARGS="--fetch-issues ${GITHUB_REPOSITORY} --out promote-out-decision.json --summary ${GITHUB_STEP_SUMMARY}"
          if [ "$HAVE_REPORT" = "true" ]; then ARGS="$ARGS --report promote-out/report.json"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only ${ONLY}"; fi
          if [ "$DRY" != "true" ]; then ARGS="$ARGS --apply --alerts"; fi
          python tools/promote_gate.py $ARGS
          if [ -z "$(git status --porcelain -- components/automation-registry)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$(git status --porcelain -- components/automation-registry/manifest.yaml)" ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          else
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the promotion to main
        if: ${{ steps.gate.outputs.changed == 'true' && steps.args.outputs.dry != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/automation-registry/manifest.yaml components/automation-registry/rollout-state.json components/automation-registry/history
          git commit -q -m "registry: staged rollout ${GITHUB_RUN_ID} [skip ci]" || { echo "nothing to commit"; exit 0; }
          # another writer (release, an ops-action merge, a human) may have moved main meanwhile: rebase and retry
          for attempt in 1 2 3 4 5; do
            if ! git -c "http.extraheader=Authorization: Basic $AUTH" pull --rebase --quiet origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::error title=promotion not committed::rebase onto main conflicted (someone edited the manifest); the next run decides again"
              exit 1
            fi
            if git -c "http.extraheader=Authorization: Basic $AUTH" push origin HEAD:main; then exit 0; fi
            echo "push lost a race (attempt ${attempt}); retrying"
            sleep $((attempt * 3))
          done
          echo "::error title=promotion not committed::main kept moving; the next run decides again"
          exit 1
      - name: Republish the registry so the new ring assignment goes live
        if: ${{ steps.gate.outputs.promoted == 'true' && steps.args.outputs.dry != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
