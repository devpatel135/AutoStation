[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapper-core"
version = "0.3.0"
description = "AUTOSTATION wrapper-core: bootstrapper, self-heal, run lifecycle, logging client, LLM seam"
requires-python = ">=3.9"
dependencies = []          # stdlib only: the endpoint is airgapped

[project.optional-dependencies]
pydantic = ["pydantic>=2"]  # optional richer llm_call schemas
assist = ["jinja2>=3"]      # developer assist CLI only
dev = ["pytest>=7", "pydantic>=2", "jinja2>=3"]

[tool.setuptools.packages.find]
include = ["wrapper_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
