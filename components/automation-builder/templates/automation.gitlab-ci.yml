# .gitlab-ci.yml for an automation-{name} repository  (copy it, set the variables, done).
#
# What it does on every pipeline:   lint + pytest  ->  package payload  ->  build the DEV-ring installer
# What it does on a version tag:    ...and opens a DEV-ring merge request against the registry.
#
# What it deliberately does NOT do: promote to pilot or broad. The registry MR approval is the governance gate
# (full audit trail); promotion is a separate, reviewed registry MR (`registry promote`).

include:
  - project: platform/automation-builder
    ref: main
    file: /templates/build-installer.gitlab-ci.yml

stages:
  - test
  - package
  - installer
  - publish

variables:
  BUILDER_IMAGE: $CI_REGISTRY/platform/automation-builder/builder:latest
  AUTOMATION_NAME: automation-example-hello
  # on a tag v1.2.3 the version is 1.2.3; on branches use the value from automation.yaml (kept in sync by `package`)
  AUTOMATION_VERSION: $CI_COMMIT_TAG
  PAYLOAD_DIR: "."
  BUILD_RING: dev
  REGISTRY_URL: https://registry.example.internal/
  LOG_REMOTE: git@gitlab.example.internal:platform/automation-logging.git

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

lint-and-test:
  stage: test
  image: $BUILDER_IMAGE
  script:
    - python -m compileall -q "$PAYLOAD_DIR"
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

package:
  extends: .package-payload
  needs: [lint-and-test]
  before_script:
    - export AUTOMATION_VERSION="${CI_COMMIT_TAG#v}"
    - export AUTOMATION_VERSION="${AUTOMATION_VERSION:-0.0.0-ci.$CI_PIPELINE_IID}"

installer-dev:
  extends: .build-installer
  needs: [package]
  before_script:
    - export AUTOMATION_VERSION="${CI_COMMIT_TAG#v}"
    - export AUTOMATION_VERSION="${AUTOMATION_VERSION:-0.0.0-ci.$CI_PIPELINE_IID}"

open-registry-mr:
  extends: .open-registry-mr
  needs: [package, installer-dev]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - export AUTOMATION_VERSION="${CI_COMMIT_TAG#v}"
