# automation-builder CI: test the build tooling, then build + publish the builder Docker image to the project registry.
# Everything pulls from INTERNAL sources (containeryard, PyPI mirror). Set the placeholders under `variables` (or as
# group-level CI variables) to your real internal hosts.
#
# Works from the monorepo (wrapper-core next to this dir) and from a split-out project (set WRAPPER_CORE_ZIP_BOOTSTRAP
# variables so the `wrapper-core` job below fetches it from the registry).

stages:
  - test
  - image

variables:
  BASE_IMAGE: containeryard.example.internal/base/python:3.12-slim
  KANIKO_IMAGE: containeryard.example.internal/tools/kaniko-executor:debug
  PIP_INDEX_URL: https://pypi-mirror.example.internal/simple
  APT_MIRROR: https://apt-mirror.example.internal/debian
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.python:
  image: $BASE_IMAGE
  before_script:
    - pip install --index-url "$PIP_INDEX_URL" jinja2 pydantic pytest

test:
  extends: .python
  stage: test
  script:
    - export WRAPPER_CORE_PATH="${WRAPPER_CORE_PATH:-$CI_PROJECT_DIR/../wrapper-core}"
    - python -m pytest -q --junitxml=report.xml tests
  artifacts:
    when: always
    reports:
      junit: report.xml

validate-nsi-template:
  extends: .python
  stage: test
  script:
    - export WRAPPER_CORE_PATH="${WRAPPER_CORE_PATH:-$CI_PROJECT_DIR/../wrapper-core}"
    - python -m pytest -q tests/test_installer.py -k "validates"

prepare-context:
  extends: .python
  stage: image
  needs: [test]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - export WRAPPER_CORE_PATH="${WRAPPER_CORE_PATH:-$CI_PROJECT_DIR/../wrapper-core}"
    - python docker/make_context.py build-context
  artifacts:
    paths:
      - build-context
    expire_in: 1 hour

build-image:
  stage: image
  needs: [prepare-context]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/build-context" --dockerfile "$CI_PROJECT_DIR/build-context/builder/docker/Dockerfile" --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg PIP_INDEX_URL="$PIP_INDEX_URL" --build-arg APT_MIRROR="$APT_MIRROR" --destination "$CI_REGISTRY_IMAGE/builder:$CI_COMMIT_SHORT_SHA" --destination "$CI_REGISTRY_IMAGE/builder:latest"
