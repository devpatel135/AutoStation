name: automation-certification-site
version: 1.0.0
runtime: node
entrypoint: main.js
args: []
requires: {wrapper_core: ">=0.1.0,<1.0.0", execution_framework: ">=0.1.0,<1.0.0"}
timeout_s: 900
# Defaults used when no registry manifest is reachable; a manifest entry overrides these.
# Runs at 09:00 daily and once right after install. Headed on purpose: the first sign-in to the browser profile is interactive.
schedule:
  slots:
    - {id: daily, type: daily, time: "09:00", params: {}}
  expected_duration_ms: {baseline: 30000, warn_threshold: 4.0}
error_handling: {max_retries: 2, network_retry_wait_s: 30, backoff_multiplier: 2.0, skip_on_data_error: true}
data_classification: internal
notify_on_complete: false
